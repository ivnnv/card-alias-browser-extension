<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Card Alias</title>
  </head>
  <body>
    <main>
      <h1>Card Alias</h1>
      <p class="sub">
        Aliases sync through your Chrome profile. Only the brand, the last digits and your alias are stored.
      </p>

      <section>
        <h2>Cards</h2>
        <ul id="cards"></ul>
        <p id="empty" class="sub" hidden>
          No aliases yet. Click a <b>+</b> badge next to a card number, or right-click one and pick "Add card alias…".
        </p>
      </section>

      <section>
        <h2>Sites with manual cards</h2>
        <ul id="sites"></ul>
        <p id="no-sites" class="sub" hidden>None.</p>
      </section>

      <section>
        <h2>Colors</h2>
        <div class="colors">
          <label><input id="new-color" type="color" /> No alias yet</label>
          <label><input id="known-color" type="color" /> Has alias</label>
          <button id="reset-colors">Reset</button>
        </div>
      </section>

      <section class="actions">
        <button id="export">Export JSON</button>
        <button id="import-button" type="button">Import JSON</button>
        <input id="import" type="file" accept="application/json" hidden />
        <span id="status" class="sub"></span>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
